<div class="modal-container">
  <div class="form-container">
    <p-floatlabel
      variant="on"
      class="custom-floatlabel"
      style="margin-bottom: 16px"
    >
      <p-iconfield>
        <p-inputicon class="pi pi-pencil" />
        <input
          pInputText
          id="name"
          autocomplete="off"
          class="w-full custom-input"
          [(ngModel)]="annotationNumber"
        />
      </p-iconfield>
      <label for="name">Annotation number required</label>
    </p-floatlabel>

    <div class="form-field">
      <fieldset class="radio-group">
        <legend class="radio-legend">Select annotation depth</legend>

        <div class="radio-options">
          <div class="p-field-radiobutton">
            <p-radioButton
              name="annotation-depth"
              value="category"
              [(ngModel)]="annotationDepth"
              inputId="high"
            ></p-radioButton>
            <label for="high">Level 1: Category</label>
          </div>

          <div class="p-field-radiobutton">
            <p-radioButton
              name="annotation-depth"
              value="sub_category"
              [(ngModel)]="annotationDepth"
              inputId="medium"
            ></p-radioButton>
            <label for="medium">Level 2: Sub Category</label>
          </div>

          <div class="p-field-radiobutton">
            <p-radioButton
              name="annotation-depth"
              value="specific_skill"
              [(ngModel)]="annotationDepth"
              inputId="low"
            ></p-radioButton>
            <label for="low">Level 3: Specific Skills</label>
          </div>
        </div>
      </fieldset>
    </div>

    <div class="button-container">
      <p-button
        class="custom-button generate-button"
        [disabled]="!annotationDepth || isLoading"
        (click)="generateAnnotations()"
      >
        <ng-container *ngIf="!isLoading; else loadingTemplate">
          Generate
        </ng-container>
        <ng-template #loadingTemplate>
          <i class="pi pi-spinner pi-spin"></i>
        </ng-template>
      </p-button>

      <p-button class="custom-button" (click)="closeModal()"> Close </p-button>
    </div>

    <div class="annotation-panel" *ngIf="aiBokConcepts.length !== 0">
      <div class="flex align-items-start flex-wrap annotation-chip-list">
        <ng-container *ngFor="let concept of aiBokConcepts">
          <p-chip
            [label]="'[' + concept + '] ' + (getConceptName(concept) | async)"
            [removable]="false"
            [style.background]="getBackgroundColor(concept) | async"
            [style.color]="'var(--primary-color)'"
            [style]="{ '--p-chip-remove-icon-color': 'var(--primary-color)' }"
            [style.border]="
              selectedAiConcepts.includes(concept) ? '2px solid #3fb3f8' : ''
            "
            [style.cursor]="'pointer'"
            class="lg:white-space-nowrap"
            (click)="toggleConceptSelection(concept)"
          />
        </ng-container>
      </div>
      <p-button class="annotation-submit-btn" (click)="addBokSelection()">
        Add selected annotation
      </p-button>
    </div>
    <div class="annotation-actions">
      <p
        *ngIf="errorMessage"
        style="color: var(--danger-color)"
        class="annotation-error-msg"
      >
        {{ errorMessage }}
      </p>
    </div>
  </div>
</div>
